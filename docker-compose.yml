
services:
  app:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"  # Adjust if your app uses a different port
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - "**/__pycache__"
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
